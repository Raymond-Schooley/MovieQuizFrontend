# Used by the production image (see Dockerfile): this container is both
# the static file server for the built React app AND the reverse proxy to
# the backend, so the browser only ever talks to one origin. "backend" is
# the service name docker-compose.yml gives the Spring Boot container -
# Docker's embedded DNS resolves it on the compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # SPA fallback: any route the router doesn't recognize still gets
    # index.html so client-side routing (if you add any) works on refresh.
    location / {
        try_files $uri /index.html;
    }
}
